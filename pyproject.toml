[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cloud-architecture-diagrams"
version = "0.2.0a1"
description = "Data-only architecture contracts and deterministic core validation"
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic>=2.12,<3"]

[project.scripts]
cloud-diagrams = "cloud_architecture_diagrams.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_architecture_diagrams"]

[tool.ruff]
target-version = "py313"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"] # Formatter controls layout; diagnostic text may exceed the soft line bound.

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "build>=1.6.1",
    "hatchling==1.27.0",
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.3",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20261030",
]
