[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cloud-architecture-diagrams"
version = "0.5.0a1"
description = "Data-only architecture contracts, provider catalogs, deterministic validation and controlled rendering"
requires-python = ">=3.13,<3.14"
# Bundled Huawei icons are for private personal use only (D-017), and PyPI rejects this classifier.
classifiers = ["Private :: Do Not Upload"]
dependencies = ["diagrams==0.25.1", "graphviz>=0.20.3,<0.21", "pydantic>=2.12,<3"]

[project.scripts]
cloud-diagrams = "cloud_architecture_diagrams.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_architecture_diagrams"]

[tool.hatch.build.targets.sdist]
# The Claude plugin links back to src, and hatchling walks each directory once. Entering that link
# first would drop the real src from the sdist, so the walk must skip the plugin entirely.
exclude = [
  "/plugins",
  "/.claude-plugin",
  "/.claude",
  "/.agents",
  "/.git",
  "/assets-source",
  "/doc",
  "/spikes",
  "/tests/baselines",
]
skip-excluded-dirs = true

[tool.ruff]
target-version = "py313"
line-length = 100
include = [
    "src/**/*.py",
    "tests/**/*.py",
    "scripts/**/*.py",
    "plugins/cloud-architecture-work/server/**/*.py",
    "plugins/cloud-architecture-work/scripts/**/*.py",
]

[tool.ruff.per-file-target-version]
# The Work tool process runs on whatever python3 a Mac has, which can be Apple's 3.9.
"plugins/cloud-architecture-work/**/*.py" = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"] # Formatter controls layout; diagnostic text may exceed the soft line bound.

[tool.mypy]
python_version = "3.13"
strict = true
files = [
    "src",
    "scripts",
    "tests",
    "plugins/cloud-architecture-work/server/main.py",
    "plugins/cloud-architecture-work/server/work_adapter",
    "plugins/cloud-architecture-work/scripts/runtime.py",
]
mypy_path = "plugins/cloud-architecture-work/server"

[[tool.mypy.overrides]]
# Neither package ships type information, so the renderer treats both as untyped at this edge.
module = ["diagrams.*", "graphviz.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "build>=1.6.1",
    "hatchling==1.27.0",
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.3",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20261030",
]
